<text x="490" y="532" font-size="12.5">  (1:10, primaries in parallel)</text>
<text x="490" y="550" font-size="12.5">CSD19531Q5A switch</text>
<text x="490" y="568" font-size="12.5">6 mΩ current-sense resistor</text>
<text x="490" y="586" font-size="12.5">Primary clamp</text>
