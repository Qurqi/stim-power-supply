<text x="50" y="232" font-size="12.5">Connector J3 to the analog board</text>
<rect x="40" y="330" width="280" height="70" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="8 5"/>
<text x="50" y="352" font-size="15" font-weight="bold">ANALOG POWER DISTRIBUTION</text>
<text x="50" y="374" font-size="12.5">Board (external)</text>
<rect x="40" y="470" width="280" height="200" fill="#fffff0" stroke="#000" stroke-width="2"/>
<text x="50" y="492" font-size="15" font-weight="bold">INPUT AND CONTROLLER</text>
<text x="312" y="662" font-size="11" font-style="italic" text-anchor="end">PGND / AGND</text>
<text x="50" y="514" font-size="12.5">Input J1, fuse F2 (10 A)</text>
<text x="50" y="532" font-size="12.5">LM51551 controller, 252 kHz</text>
<text x="50" y="550" font-size="12.5">Input capacitors (8 × 10 µF, 330 µF)</text>
<text x="50" y="568" font-size="12.5">UVLO: on 7.5 V, off 7.0 V</text>
<text x="50" y="586" font-size="12.5">Soft start (680 nF)</text>
<rect x="40" y="730" width="280" height="90" fill="#fffff0" stroke="#000" stroke-width="2"/>
<text x="50" y="752" font-size="15" font-weight="bold">LATCH</text>
<text x="312" y="812" font-size="11" font-style="italic" text-anchor="end">AGND</text>
<text x="50" y="774" font-size="12.5">Holds the controller off after a trip</text>
<text x="50" y="792" font-size="12.5">Reset by disconnecting the battery</text>
<rect x="480" y="470" width="300" height="200" fill="#fffff0" stroke="#000" stroke-width="2"/>
<text x="490" y="492" font-size="15" font-weight="bold">POWER STAGE</text>
