<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="920" viewBox="0 0 1580 920" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000"/></marker></defs>
<rect width="1580" height="920" fill="#fff"/>
<rect x="40" y="40" width="280" height="70" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="8 5"/>
<text x="50" y="62" font-size="15" font-weight="bold">BATTERY</text>
<text x="50" y="84" font-size="12.5">3-cell lithium-ion pack</text>
<text x="50" y="102" font-size="12.5">9 to 12.6 V (external)</text>
<rect x="40" y="170" width="280" height="100" fill="#fffff0" stroke="#000" stroke-width="2"/>
