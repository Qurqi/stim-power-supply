<text x="575" y="840" font-size="12" text-anchor="start">Dashed box: outside the power board</text>
<text x="490" y="862" font-size="12" text-anchor="start">Grounds are not drawn. The italic tag gives the ground of each block: PGND / AGND primary, SGND secondary.</text>
<text x="490" y="882" font-size="12" text-anchor="start">"crosses barrier": holds a transformer or optocoupler joining the two sides. No copper joins SGND to PGND.</text>
